<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="460" fill="#0b1420"/>

  <text x="450" y="34" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">PolicyNet — Genome Architecture</text>
  <text x="450" y="54" text-anchor="middle" fill="#8fa3b8" font-size="12">Fully-connected feed-forward network, Tanh activations</text>

  <!-- Column labels -->
  <text x="130" y="90" text-anchor="middle" fill="#7fd1ff" font-size="13" font-weight="600">Input (7)</text>
  <text x="360" y="90" text-anchor="middle" fill="#a3f7a3" font-size="13" font-weight="600">Hidden 1 (24, Tanh)</text>
  <text x="590" y="90" text-anchor="middle" fill="#a3f7a3" font-size="13" font-weight="600">Hidden 2 (24, Tanh)</text>
  <text x="800" y="90" text-anchor="middle" fill="#ffcf7f" font-size="13" font-weight="600">Output (2, Tanh)</text>

  <!-- Input nodes -->
  <g id="inputs">
    <circle cx="130" cy="120" r="12" fill="#1b3a4b" stroke="#7fd1ff" stroke-width="2"/>
    <circle cx="130" cy="165" r="12" fill="#1b3a4b" stroke="#7fd1ff" stroke-width="2"/>
    <circle cx="130" cy="210" r="12" fill="#1b3a4b" stroke="#7fd1ff" stroke-width="2"/>
    <circle cx="130" cy="255" r="12" fill="#1b3a4b" stroke="#7fd1ff" stroke-width="2"/>
    <circle cx="130" cy="300" r="12" fill="#1b3a4b" stroke="#7fd1ff" stroke-width="2"/>
    <circle cx="130" cy="345" r="12" fill="#1b3a4b" stroke="#7fd1ff" stroke-width="2"/>
    <circle cx="130" cy="390" r="12" fill="#1b3a4b" stroke="#7fd1ff" stroke-width="2"/>
  </g>
  <g fill="#c9d6e3" font-size="11" text-anchor="end">
    <text x="105" y="124">Alignment cos</text>
    <text x="105" y="169">Azimuth error</text>
    <text x="105" y="214">Elevation error</text>
    <text x="105" y="259">Distance</text>
    <text x="105" y="304">Pitch</text>
    <text x="105" y="349">Roll</text>
    <text x="105" y="394">Altitude</text>
  </g>

  <!-- Hidden layer 1: represented as a compact block of nodes -->
  <g id="hidden1">
    <rect x="335" y="105" width="50" height="300" rx="10" fill="#0f2a1f" stroke="#3fae5a" stroke-width="1.5"/>
    <g fill="#a3f7a3">
      <circle cx="360" cy="130" r="5"/><circle cx="360" cy="150" r="5"/><circle cx="360" cy="170" r="5"/>
      <circle cx="360" cy="190" r="5"/><circle cx="360" cy="210" r="5"/><circle cx="360" cy="230" r="5"/>
      <circle cx="360" cy="250" r="5"/><circle cx="360" cy="270" r="5"/><circle cx="360" cy="290" r="5"/>
      <circle cx="360" cy="310" r="5"/><circle cx="360" cy="330" r="5"/><circle cx="360" cy="350" r="5"/>
    </g>
    <text x="360" y="392" text-anchor="middle" fill="#8fd8a0" font-size="11">×24</text>
  </g>

  <!-- Hidden layer 2 -->
  <g id="hidden2">
    <rect x="565" y="105" width="50" height="300" rx="10" fill="#0f2a1f" stroke="#3fae5a" stroke-width="1.5"/>
    <g fill="#a3f7a3">
      <circle cx="590" cy="130" r="5"/><circle cx="590" cy="150" r="5"/><circle cx="590" cy="170" r="5"/>
      <circle cx="590" cy="190" r="5"/><circle cx="590" cy="210" r="5"/><circle cx="590" cy="230" r="5"/>
      <circle cx="590" cy="250" r="5"/><circle cx="590" cy="270" r="5"/><circle cx="590" cy="290" r="5"/>
      <circle cx="590" cy="310" r="5"/><circle cx="590" cy="330" r="5"/><circle cx="590" cy="350" r="5"/>
    </g>
    <text x="590" y="392" text-anchor="middle" fill="#8fd8a0" font-size="11">×24</text>
  </g>

  <!-- Output nodes -->
  <g id="outputs">
    <circle cx="800" cy="220" r="14" fill="#3a2a10" stroke="#ffcf7f" stroke-width="2"/>
    <circle cx="800" cy="290" r="14" fill="#3a2a10" stroke="#ffcf7f" stroke-width="2"/>
  </g>
  <g fill="#ffe2ad" font-size="12" text-anchor="start">
    <text x="822" y="224">Pitch</text>
    <text x="822" y="294">Roll</text>
  </g>

  <!-- Connective flow arrows (schematic, not literal fully-connected fan-out) -->
  <g stroke="#3f5a70" stroke-width="1.2" opacity="0.55">
    <line x1="142" y1="120" x2="335" y2="150"/>
    <line x1="142" y1="165" x2="335" y2="180"/>
    <line x1="142" y1="210" x2="335" y2="210"/>
    <line x1="142" y1="255" x2="335" y2="240"/>
    <line x1="142" y1="300" x2="335" y2="270"/>
    <line x1="142" y1="345" x2="335" y2="300"/>
    <line x1="142" y1="390" x2="335" y2="330"/>
  </g>
  <line x1="385" y1="255" x2="565" y2="255" stroke="#3f5a70" stroke-width="1.5" opacity="0.7" marker-end="url(#arrow)"/>
  <line x1="615" y1="230" x2="786" y2="220" stroke="#3f5a70" stroke-width="1.5" opacity="0.7"/>
  <line x1="615" y1="280" x2="786" y2="290" stroke="#3f5a70" stroke-width="1.5" opacity="0.7"/>

  <text x="450" y="440" text-anchor="middle" fill="#5f7a8f" font-size="11">
    nn.Linear(7→24) → Tanh → nn.Linear(24→24) → Tanh → nn.Linear(24→2) → Tanh
  </text>
</svg>
